name: Quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: build_changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/classify-build-changes.mjs "$BASE_SHA" "$GITHUB_SHA"
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.21.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type and Astro checks
        run: pnpm check
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: SEO and link audit
        run: pnpm audit:seo
